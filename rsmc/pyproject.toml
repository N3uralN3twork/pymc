[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "pymc-rsmc"
version = "0.1.0"
description = "Experimental Rust computation kernels for PyMC comparisons"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.25"]

[tool.maturin]
bindings = "pyo3"
module-name = "pymc_rust"
features = ["python"]
